function buildPrompt(id,i){
  const b=`Business: ${i.businessName||"N/A"}\nIndustry: ${i.industry||"N/A"}\nStage: ${i.stage||"N/A"}\nLocation: ${i.location||"UAE/GCC"}\nMRR: ${i.mrr||"N/A"}\nTeam: ${i.team||"N/A"}\nTarget Market: ${i.targetMarket||"N/A"}\nUSP: ${i.usp||"N/A"}\nDescription: ${i.description||"N/A"}`;
  const P={
    swot:`You are a senior business strategist. Create a comprehensive SWOT Analysis.\n\n${b}\n\n**STRENGTHS** — 5 internal advantages\n**WEAKNESSES** — 5 internal gaps\n**OPPORTUNITIES** — 5 external growth opportunities\n**THREATS** — 5 external risks\n**STRATEGIC IMPLICATIONS** — 3 priority actions\n**KEY INSIGHT** — Most important strategic finding`,
    competitor:`You are a competitive intelligence analyst.\n\n${b}\n\n**TOP 5 COMPETITORS** — Name, pricing, strengths, weaknesses\n**MARKET GAPS** — 3 underserved opportunities\n**DIFFERENTIATION STRATEGY** — How to win\n**BATTLECARD** — 5 talking points vs competitors`,
    pitch:`You are a pitch deck consultant. Create a 12-slide pitch deck.\n\n${b}\n\n**SLIDE 1: COVER** | **SLIDE 2: PROBLEM** | **SLIDE 3: SOLUTION** | **SLIDE 4: MARKET** | **SLIDE 5: PRODUCT** | **SLIDE 6: BUSINESS MODEL** | **SLIDE 7: TRACTION** | **SLIDE 8: COMPETITIVE LANDSCAPE** | **SLIDE 9: GO-TO-MARKET** | **SLIDE 10: TEAM** | **SLIDE 11: FINANCIALS** | **SLIDE 12: THE ASK**`,
    canvas:`You are an Osterwalder expert.\n\n${b}\n\n**1. CUSTOMER SEGMENTS** | **2. VALUE PROPOSITIONS** | **3. CHANNELS** | **4. CUSTOMER RELATIONSHIPS** | **5. REVENUE STREAMS** | **6. KEY RESOURCES** | **7. KEY ACTIVITIES** | **8. KEY PARTNERSHIPS** | **9. COST STRUCTURE**\n\n**CANVAS HEALTH CHECK** — Rate each block 1-5`,
    financials:`You are a CFO. Create 3-year financial projections.\n\n${b}\n\n**REVENUE PROJECTIONS** — Conservative/Base/Optimistic\n**COST STRUCTURE** — Fixed, variable, one-time\n**KEY METRICS** — Gross margin, CAC, LTV, break-even\n**CASH FLOW** — Monthly burn and runway\n**FUNDRAISING NEED**`,
    market:`You are a market research analyst.\n\n${b}\n\n**MARKET SIZE** — TAM, SAM, SOM\n**MARKET TRENDS** — 5 key 2025-2026 trends\n**CUSTOMER SEGMENTATION** — 3-4 distinct segments\n**ENTRY BARRIERS** | **REGULATORY ENVIRONMENT** (UAE/GCC)\n**MARKET ENTRY STRATEGY**`,
    persona:`You are a customer research expert. Build 2 buyer personas.\n\n${b}\n\nFor each: **DEMOGRAPHICS** | **PAIN POINTS** (Top 5) | **GOALS** | **BUYING BEHAVIOUR** | **OBJECTIONS** | **RESONANT MESSAGING**`,
    okr:`You are an OKR expert.\n\n${b}\n\n**COMPANY OKRs** — 3 Objectives, 3-4 KRs each\n**DEPARTMENT OKRs** — Sales, Marketing, Product, People\n**SCORING GUIDE** | **WEEKLY CHECK-IN TEMPLATE**`,
    roadmap:`You are a product strategist.\n\n${b}\n\n**Q1 — Foundation** | **Q2 — Traction** | **Q3 — Scale** | **Q4 — Optimise**\n**NORTH STAR METRIC** | **PRIORITISATION FRAMEWORK**`,
    valuation:`You are a startup valuation expert.\n\n${b}\n\n**REVENUE MULTIPLE** | **DCF** | **COMPARABLE TRANSACTIONS** | **SCORECARD METHOD**\n**VALUATION SUMMARY** — Low/Mid/High\n**5 LEVERS TO INCREASE VALUATION**`,
    lean:`You are a Lean Startup expert.\n\n${b}\n\n**1. PROBLEM** | **2. CUSTOMER SEGMENTS** | **3. UVP** | **4. SOLUTION** | **5. CHANNELS** | **6. REVENUE** | **7. COSTS** | **8. KEY METRICS** | **9. UNFAIR ADVANTAGE**\n**MVP DEFINITION**`,
    exit:`You are an M&A advisor.\n\n${b}\n\n**EXIT OPTIONS** — Acquisition, PE buyout, IPO, MBO\n**RECOMMENDED PATH** | **VALUE CREATION ROADMAP** | **DUE DILIGENCE PREP** | **UAE/GCC TAX CONSIDERATIONS**`,

  const mark=(sid,i)=>setWatched(p=>({...p,[`${sid}-${i}`]:true}));

  if(activeSession){

    const slide=session.slides[slideIdx];

    const wCount=session.slides.filter((_,i)=>watched[`${session.id}-${i}`]).length;
    return(
      <div>

        </div>

          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:session.color+"22",color:session.color}}>{total} slides</span>
            <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:"rgba(52,211,153,0.15)",color:C.green}}>{wCount}/{total} viewed</span>
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginBottom:18}}>
          {["slides","infographics"].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"8px 18px",borderRadius:20,border:"none",fontSize:12,fontWeight:700,background:tab===t?C.grad1:"rgba(255,255,255,0.06)",color:tab===t?"#fff":C.textSub}}>{t==="slides"?`📑 Slides (${total})`:`🖼️ Infographics (${session.infographics?.length||0})`}</button>)}
        </div>
        {tab==="slides"&&(
          <div style={{display:"grid",gridTemplateColumns:"240px 1fr",gap:16}}>
            <div style={{maxHeight:580,overflowY:"auto"}}>
              {session.slides.map((s,i)=>{const isW=watched[`${session.id}-${i}`];const isA=slideIdx===i;return(<div key={i} onClick={()=>{setSlideIdx(i);mark(session.id,i);}} style={{padding:"9px 11px",borderRadius:9,marginBottom:4,cursor:"pointer",background:isA?`${session.color}20`:"rgba(255,255,255,0.03)",border:`1px solid ${isA?session.color+"55":C.border}`}}><div style={{display:"flex",alignItems:"flex-start",gap:7}}><div style={{width:20,height:20,borderRadius:5,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,background:isW?"rgba(52,211,153,0.2)":isA?session.color+"22":"rgba(255,255,255,0.06)",color:isW?C.green:isA?session.color:C.textMuted}}>{isW?"✓":i+1}</div><div><div style={{fontSize:11,fontWeight:isA?700:400,color:isA?C.text:C.textSub,lineHeight:1.4,marginBottom:1}}>{s.title}</div><div style={{fontSize:9,color:C.textMuted,lineHeight:1.3}}>{s.desc}</div></div></div></div>);})}
            </div>
            <div>
              <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:14,overflow:"hidden",marginBottom:10}}>
                <div style={{background:"linear-gradient(135deg,#0d1535,#1a1040)",minHeight:340,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:36,position:"relative",textAlign:"center"}}>
                  <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:`linear-gradient(90deg,${session.color},${session.color}66,transparent)`}}/>
                  <div style={{width:52,height:52,borderRadius:14,background:session.color+"22",border:`1px solid ${session.color}44`,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16,fontSize:22}}>{session.emoji}</div>
                  <div style={{fontSize:10,fontWeight:700,color:session.color,marginBottom:8,letterSpacing:"0.1em",textTransform:"uppercase"}}>Slide {slideIdx+1} of {total}</div>

                  <div style={{position:"absolute",bottom:12,right:16,fontSize:10,color:"rgba(255,255,255,0.15)"}}>Creative Scale · AI in Business Course 2025</div>
                </div>
                <div style={{padding:"12px 18px",borderTop:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <button onClick={()=>{if(slideIdx>0){setSlideIdx(i=>i-1);mark(session.id,slideIdx-1);}}} disabled={slideIdx===0} style={{padding:"7px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.05)",color:C.textSub,fontSize:12,opacity:slideIdx===0?.4:1}}>← Prev</button>

                <div style={{padding:14}}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:5}}>{inf.title}</div><div style={{fontSize:11,color:C.textMuted,lineHeight:1.6}}>{inf.desc}</div></div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const totalSlides=SESSIONS.reduce((a,s)=>a+s.slides.length,0);

      <div style={{fontFamily:SORA,fontSize:15,fontWeight:700,color:C.text,marginBottom:12,display:"flex",alignItems:"center",gap:10}}>📑 Presentation Sessions<div style={{flex:1,height:1,background:C.border}}/></div>

          return(<div key={session.id} onClick={()=>{setActiveSession(session.id);setSlideIdx(0);setTab("slides");}} style={{padding:20,borderRadius:14,cursor:"pointer",background:C.bgCard,border:`1px solid ${pct===100?session.color+"44":C.border}`,transition:"all .2s",position:"relative",overflow:"hidden"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=session.color+"66";e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.borderColor=pct===100?session.color+"44":C.border;e.currentTarget.style.transform="translateY(0)";}}>

inBottom:10}}>TOOL COMPARISON</div><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{borderBottom:`1px solid ${C.border}`}}>{["Tool","Best For","Price","Ease","Power"].map(h=><th key={h} style={{padding:"7px 9px",color:C.textMuted,textAlign:"left",fontSize:11}}>{h}</th>)}</tr></thead><tbody>{lesson.tools.map((t,i)=><tr key={i} style={{borderBottom:`1px solid rgba(255,255,255,.04)`}}><td style={{padding:"8px 9px",fontWeight:700,color:C.text}}>{t.n}</td><td style={{padding:"8px 9px",color:C.textSub}}>{t.role}</td><td style={{padding:"8px 9px",color:C.green}}>{t.price}</td><td style={{padding:"8px 9px"}}>{"★".repeat(t.ease)}</td><td style={{padding:"8px 9px"}}>{"★".repeat(t.power)}</td></tr>)}</tbody></table></div>}{lesson.points&&lesson.points.length>0&&<div style={{background:"rgba(59,130,246,.06)",border:`1px solid rgba(59,130,246,.2)`,borderRadius:11,padding:14}}><div style={{fontSize:11,fontWeight:700,color:C.blue,marginBottom:9}}>🔑 KEY TAKEAWAYS</div>{lesson.points.map((p,i)=><div key={i} style={{display:"flex",gap:9,marginBottom:7}}><span style={{color:mod.color,fontWeight:700,fontSize:13,flexShrink:0}}>✓</span><span style={{fontSize:13,color:C.text,lineHeight:1.65}}>{p}</span></div>)}</div>}</div>}
  {lesson.type==="quiz"&&<div>{!submitted?<><p style={{fontSize:13,color:C.textSub,marginBottom:18}}>Answer all {lesson.questions.length} questions. You need 75% to pass.</p>{lesson.questions.map((q,qi)=>(<div key={qi} style={{marginBottom:20}}><div style={{fontSize:14,fontWeight:600,color:C.text,marginBottom:9}}>{qi+1}. {q.q}</div>{q.opts.map((opt,oi)=><div key={oi} onClick={()=>setQuizAns(a=>({...a,[qi]:oi}))} style={{padding:"10px 15px",borderRadius:9,marginBottom:5,cursor:"pointer",border:`1.5px solid ${quizAns[qi]===oi?mod.color:C.border}`,background:quizAns[qi]===oi?mod.color+"15":"rgba(255,255,255,.03)",fontSize:13,color:C.text}}><span style={{fontWeight:700,color:mod.color,marginRight:9}}>{String.fromCharCode(65+oi)}.</span>{opt}</div>)}</div>))}<Btn onClick={submitQuiz} disabled={Object.keys(quizAns).length<lesson.questions.length}>Submit Quiz →</Btn></>:<div style={{textAlign:"center",padding:"20px 0"}}><div style={{fontSize:52,marginBottom:10}}>{score>=Math.ceil(lesson.questions.length*.75)?"🎉":"😅"}</div><div style={{fontSize:22,fontWeight:800,color:C.text,marginBottom:7}}>{score}/{lesson.questions.length} Correct</div><div style={{fontSize:14,color:score>=Math.ceil(lesson.questions.length*.75)?C.green:C.coral}}>{score>=Math.ceil(lesson.questions.length*.75)?"Excellent! Module complete — XP earned!":"Review the lesson and try again."}</div></div>}</div>}
  </Card>
  <div style={{display:"flex",justifyContent:"space-between"}}><button onClick={onPrev} disabled={lessonIdx===0} style={{padding:"9px 20px",borderRadius:11,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.06)",color:C.textSub,fontSize:13,opacity:lessonIdx===0?.4:1}}>← Previous</button><button onClick={onNext} style={{padding:"9px 20px",borderRadius:11,border:"none",background:C.grad1,color:"#fff",fontSize:13,fontWeight:700,boxShadow:"0 4px 16px rgba(79,142,247,0.35)"}}>{isLast?"Complete Module":"Next Lesson →"}</button></div>
  </div>);
}

    <div><Card style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:C.textSub,marginBottom:9}}>REPORT TYPE</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>{types.map(t=><button key={t.id} onClick={()=>setRepType(t.id)} style={{padding:"8px 10px",borderRadius:9,border:`1px solid ${repType===t.id?C.blue:C.border}`,background:repType===t.id?"rgba(79,142,247,0.2)":"rgba(255,255,255,.04)",color:repType===t.id?C.blue:C.textSub,fontSize:11,textAlign:"left",fontWeight:repType===t.id?700:400}}>{t.label}</button>)}</div></Card>
    <Card style={{marginBottom:12}}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:11}}><div><label style={{fontSize:10,fontWeight:700,color:C.textMuted,display:"block",marginBottom:4,textTransform:"uppercase"}}>COMPANY</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="e.g. Creative Scale" style={{width:"100%",padding:"8px 11px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.04)",color:C.text,fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:SANS}}/></div><div><label style={{fontSize:10,fontWeight:700,color:C.textMuted,display:"block",marginBottom:4,textTransform:"uppercase"}}>PERIOD</label><select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:"100%",padding:"8px 11px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(7,11,20,0.95)",color:C.text,fontSize:13,outline:"none"}}>{["Daily","Weekly","Monthly","Quarterly","Annual"].map(p=><option key={p}>{p}</option>)}</select></div></div><label style={{fontSize:10,fontWeight:700,color:C.textMuted,display:"block",marginBottom:4,textTransform:"uppercase"}}>DATA & CONTEXT</label><textarea value={data} onChange={e=>setData(e.target.value)} rows={5} placeholder="Paste your data, notes, metrics here..." style={{width:"100%",padding:"8px 11px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.04)",color:C.text,fontSize:13,outline:"none",boxSizing:"border-box",resize:"vertical",fontFamily:SANS,lineHeight:1.7}}/></Card>
    <Card style={{marginBottom:12}}><div style={{fontSize:11,fontWeight:700,color:C.textSub,marginBottom:8}}>OUTPUT FORMAT</div><div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{formats.map(f=><button key={f.id} onClick={()=>setFormat(f.id)} style={{padding:"6px 13px",borderRadius:20,border:"none",fontSize:11,background:format===f.id?C.grad2:"rgba(255,255,255,.06)",color:format===f.id?"#fff":C.textSub,fontWeight:format===f.id?700:400}}>{f.label}</button>)}</div></Card>
    <Btn onClick={generate} disabled={!company||!data||loading} style={{width:"100%",justifyContent:"center"}}>{loading?"⏳ Generating...":"📋 Generate Report"}</Btn></div>
    <div>{output?<Card style={{position:"sticky",top:18}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}><div style={{fontSize:13,fontWeight:700,color:C.green}}>✓ Generated Report</div><div style={{display:"flex",gap:6}}><Btn variant="ghost" size="sm" onClick={download}>⬇️ Download</Btn><Btn variant="ghost" size="sm" onClick={()=>navigator.clipboard?.writeText(output)}>📋 Copy</Btn><Btn variant="ghost" size="sm" onClick={()=>setOutput("")}>Clear</Btn></div></div><div style={{fontSize:13,color:C.text,lineHeight:1.85,whiteSpace:"pre-wrap",maxHeight:560,overflowY:"auto"}}>{output}</div></Card>:<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:360,background:C.bgCard,borderRadius:14,border:`1px solid ${C.border}`,textAlign:"center",padding:28}}><div style={{fontSize:44,marginBottom:10,opacity:.2}}>📋</div><p style={{fontSize:13,color:C.textMuted}}>Your report will appear here</p></div>}</div>
  </div></div>);
}

// ── BUSINESS PROFILE ──────────────────────────────────────
function BusinessProfile({user,progress,xp}){
  const[editMode,setEditMode]=useState(false);
  const[biz,setBiz]=useState({name:"",industry:"",stage:"Startup",founded:"",location:"",website:"",email:"",phone:"",tagline:"",description:"",mission:"",vision:"",revenue:"",mrr:"",arr:"",customers:"",team:"",runway:"",model:"",channels:"",valuation:"",problem:"",solution:"",usp:"",targetMarket:"",marketSize:"",linkedin:"",instagram:"",facebook:"",twitter:""});
  const[saved,setSaved]=useState(false);
  const save=()=>{setSaved(true);setTimeout(()=>setSaved(false),2500);setEditMode(false);};
  const completed=Object.keys(progress).filter(k=>progress[k]?.completed).length;
  const totalLessons=Object.values(progress).reduce((a,m)=>a+(m?.lessons||0),0);
  const quizzes=Object.values(progress).filter(m=>m?.quizPassed).length;
  const level=xp<200?"Explorer":xp<500?"Practitioner":xp<700?"Strategist":"AI Leader";
  const levelColor={Explorer:C.textSub,Practitioner:C.blue,Strategist:C.purple,["AI Leader"]:C.amber}[level];
  const handleBiz=useCallback((field,val)=>setBiz(p=>({...p,[field]:val})),[]);
  const BF=({label,field,placeholder,large=false})=>(<div style={{marginBottom:13}}><label style={{fontSize:10,fontWeight:700,color:C.textMuted,display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>{label}</label>{editMode?(large?<textarea value={biz[field]} onChange={e=>handleBiz(field,e.target.value)} placeholder={placeholder} rows={2} style={{width:"100%",padding:"8px 11px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.04)",color:C.text,fontSize:13,outline:"none",boxSizing:"border-box",resize:"none",fontFamily:SANS,lineHeight:1.7}}/>:<input value={biz[field]} onChange={e=>handleBiz(field,e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"8px 11px",borderRadius:8,border:`1px solid ${C.border}`,background:"rgba(255,255,255,0.04)",color:C.text,fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:SANS}}/>):<div style={{fontSize:13,color:biz[field]?C.text:C.textDim,lineHeight:1.6,minHeight:18}}>{biz[field]||<span style={{fontStyle:"italic",color:C.textDim}}>Not set</span>}</div>}</div>);
  const stages=["Idea","Pre-Revenue","Startup","Growth","Scale-up","Series A+","Profitable SME","Enterprise"];
  return(<div style={{maxWidth:980,margin:"0 auto"}}>
    <div style={{position:"relative",overflow:"hidden",borderRadius:18,padding:"26px 30px",marginBottom:18,background:"linear-gradient(135deg,rgba(13,21,53,0.95),rgba(30,15,60,0.95))",border:`1px solid ${C.borderMid}`}}>
      <div style={{position:"absolute",top:-30,right:-30,width:200,height:200,borderRadius:"50%",background:"radial-gradient(circle,rgba(167,139,250,0.15),transparent 70%)",pointerEvents:"none"}}/>
      <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:14}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}><div style={{width:66,height:66,borderRadius:16,background:C.grad1,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,boxShadow:"0 0 0 1px rgba(79,142,247,0.4),0 8px 28px rgba(79,142,247,0.25)"}}>{biz.name?biz.name[0].toUpperCase():"🏢"}</div><div><h2 style={{fontFamily:SORA,fontSize:20,fontWeight:800,color:C.text,marginBottom:3}}>{biz.name||user?.name+"'s Business"}</h2><div style={{fontSize:12,color:C.textSub,marginBottom:7}}>{biz.tagline||"Your business tagline here"}</div><div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{biz.stage&&<Badge label={biz.stage} color={C.blue}/>}{biz.industry&&<Badge label={biz.industry} color={C.teal}/>}{biz.location&&<Badge label={"📍 "+biz.location} color={C.textSub}/>}<Badge label={level} color={levelColor}/></div></div></div>
        <div style={{display:"flex",gap:8}}>{editMode?<><Btn onClick={save} size="sm">✓ Save</Btn><Btn onClick={()=>setEditMode(false)} variant="ghost" size="sm">Cancel</Btn></>:<Btn onClick={()=>setEditMode(true)} variant="ghost" size="sm">✏️ Edit Business Info</Btn>}</div>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:11,marginBottom:18}}>{[{label:"Modules Completed",value:`${completed}/${MODULES.length}`,color:C.amber},{label:"XP Earned",value:xp,color:C.purple},{label:"Lessons Done",value:totalLessons,color:C.teal},{label:"Quizzes Passed",value:quizzes,color:C.green}].map(s=><StatPill key={s.label} {...s}/>)}</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div>
        <Card style={{marginBottom:13}} accent={C.blue}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:14,display:"flex",alignItems:"center",gap:7}}><SI name="build" size={14} color={C.blue}/>Core Business Information</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}><BF label="Business Name" field="name" placeholder="e.g. Creative Scale"/><BF label="Industry" field="industry" placeholder="e.g. AI Consulting"/><BF label="Founded Year" field="founded" placeholder="e.g. 2023"/><BF label="Location / HQ" field="location" placeholder="e.g. Dubai, UAE"/></div><div style={{marginBottom:13}}><label style={{fontSize:10,fontWeight:700,color:C.textMuted,display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.08em"}}>Business Stage</label>{editMode?<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{stages.map(s=><button key={s} onClick={()=>setBiz(b=>({...b,stage:s}))} style={{padding:"4px 11px",borderRadius:20,border:`1px solid ${biz.stage===s?C.blue:C.border}`,background:biz.stage===s?"rgba(79,142,247,0.2)":"rgba(255,255,255,0.04)",color:biz.stage===s?C.blue:C.textSub,fontSize:11,fontWeight:biz.stage===s?700:400}}>{s}</button>)}</div>:<div style={{fontSize:13,color:C.text}}>{biz.stage}</div>}</div><BF label="Website" field="website" placeholder="https://yoursite.com"/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}><BF label="Email" field="email" placeholder="hello@business.com"/><BF label="Phone" field="phone" placeholder="+971 XX XXX XXXX"/></div></Card>
        <Card style={{marginBottom:13}} accent={C.purple}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="spark2" size={14} color={C.purple}/>Purpose & Identity</div><BF label="Tagline / One-liner" field="tagline" placeholder="e.g. AI that grows your business, not your headcount"/><BF label="Business Description" field="description" placeholder="What do you do, who do you serve, how?" large/><BF label="Mission Statement" field="mission" placeholder="Why you exist" large/><BF label="Vision Statement" field="vision" placeholder="Where you're going in 5–10 years" large/></Card>
        <Card style={{marginBottom:13}} accent={C.coral}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="alert" size={14} color={C.coral}/>Problem & Solution</div><BF label="The Problem You Solve" field="problem" placeholder="What pain point does your customer have?" large/><BF label="Your Solution" field="solution" placeholder="How do you uniquely solve it?" large/><BF label="Unique Selling Proposition (USP)" field="usp" placeholder="Why you, and not anyone else?"/></Card>
        <Card accent={C.teal}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="globe" size={14} color={C.teal}/>Social Media</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}><BF label="LinkedIn" field="linkedin" placeholder="linkedin.com/company/..."/><BF label="Instagram" field="instagram" placeholder="@yourhandle"/><BF label="Facebook" field="facebook" placeholder="facebook.com/..."/><BF label="Twitter / X" field="twitter" placeholder="@yourhandle"/></div></Card>
      </div>
      <div>
        <Card style={{marginBottom:13}} accent={C.green}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="dollar" size={14} color={C.green}/>Financial Metrics</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 14px"}}><BF label="Monthly Revenue (MRR)" field="mrr" placeholder="e.g. $12,000"/><BF label="Annual Revenue (ARR)" field="arr" placeholder="e.g. $144,000"/><BF label="Total Revenue (LTM)" field="revenue" placeholder="e.g. $180,000"/><BF label="Runway (months)" field="runway" placeholder="e.g. 18 months"/><BF label="Valuation" field="valuation" placeholder="e.g. $1.2M Pre-seed"/><BF label="Team Size" field="team" placeholder="e.g. 5 FTEs"/></div><BF label="Customers / Users" field="customers" placeholder="e.g. 34 paying clients"/></Card>
        <Card style={{marginBottom:13}} accent={C.amber}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="canvas" size={14} color={C.amber}/>Business Model</div><BF label="Revenue Model" field="model" placeholder="e.g. SaaS / Retainer / Project-based"/><BF label="Sales & Marketing Channels" field="channels" placeholder="e.g. LinkedIn, Referrals, Cold outreach" large/></Card>
        <Card style={{marginBottom:13}} accent={C.teal}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:13,display:"flex",alignItems:"center",gap:7}}><SI name="persona" size={14} color={C.teal}/>Market & Customers</div><BF label="Target Market / ICP" field="targetMarket" placeholder="e.g. SME owners in UAE, 30-50" large/><BF label="Total Addressable Market (TAM)" field="marketSize" placeholder="e.g. $4.2B AI consulting GCC"/></Card>
        <Card><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:12}}>📚 Course Progress</div>{MODULES.map(mod=>{const prog=progress[mod.id]||{};const lp=prog.lessons?Math.round((prog.lessons/mod.lessons.length)*100):0;return(<div key={mod.id} style={{marginBottom:11}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><div style={{fontSize:12,color:C.text,display:"flex",alignItems:"center",gap:6}}><SI name={mod.icon} size={11} color={mod.color}/>{mod.title}{prog.completed&&<span style={{fontSize:9,color:C.green,fontWeight:700}}>✓</span>}</div><span style={{fontSize:11,color:mod.color,fontWeight:700}}>{lp}%</span></div><div style={{background:"rgba(255,255,255,.05)",borderRadius:4,height:3,overflow:"hidden"}}><div style={{height:3,width:`${lp}%`,background:mod.color,borderRadius:4,transition:"width .5s"}}/></div></div>);})}</Card>
      </div>
    </div>
  </div>);
}

// ── ROOT APP ──────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[screen,setScreen]=useState("login");
  const[progress,setProgress]=useState({});
  const[xp,setXp]=useState(0);
  const[activeMod,setActiveMod]=useState(null);
  const[lessonIdx,setLessonIdx]=useState(0);

  const goModule=mod=>{setActiveMod(mod);setLessonIdx(progress[mod.id]?.lessonIdx||0);setScreen("lesson");};
  const goNext=()=>{const mod=activeMod;const prog=progress[mod.id]||{};const isLast=lessonIdx===mod.lessons.length-1;const nl=Math.max(prog.lessons||0,lessonIdx+1);let np={...prog,lessons:nl,lessonIdx};if(isLast&&!prog.completed){np.completed=true;setXp(x=>x+mod.xp);}setProgress(p=>({...p,[mod.id]:np}));if(lessonIdx<mod.lessons.length-1)setLessonIdx(i=>i+1);else setScreen("dashboard");};
  const goPrev=()=>{if(lessonIdx>0)setLessonIdx(i=>i-1);};

  if(!user||screen==="login") return <LoginScreen onLogin={u=>{setUser(u);setScreen("dashboard");}}/>;

  const navItems=[{id:"dashboard",label:"Dashboard",icon:"🏠"},{id:"media",label:"Media Library",icon:"🎬"},{id:"kit",label:"Entrepreneur Kit",icon:"🚀"},{id:"tools",label:"AI Tools",icon:"🌐"},{id:"prompts",label:"Prompt Studio",icon:"⚡"},{id:"journal",label:"Journal",icon:"📔"},{id:"calc",label:"ROI Calc",icon:"📊"},{id:"reports",label:"Reports",icon:"📋"},{id:"profile",label:"Business Profile",icon:"🏢"}];

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,display:"flex"}}>
      {/* SIDEBAR */}
      <div style={{width:215,flexShrink:0,background:"rgba(5,8,16,0.98)",borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",position:"fixed",top:0,bottom:0,left:0,zIndex:50,backdropFilter:"blur(20px)"}}>
        <div style={{padding:"16px 13px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:9}}>
          <div style={{width:30,height:30,borderRadius:9,flexShrink:0,background:C.grad1,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 0 1px rgba(79,142,247,0.4),0 4px 14px rgba(79,142,247,0.25)"}}><SI name="sparkle" size={15} color="#fff"/></div>
          <div><div style={{fontFamily:SORA,fontSize:12,fontWeight:800,color:C.text,letterSpacing:"-0.3px"}}>AI Academy</div><div style={{fontSize:9,color:C.textMuted}}>by Setana Ahmed</div></div>
        </div>
        <div style={{padding:"10px 8px",flex:1,overflowY:"auto"}}>
          {navItems.map(item=>{const isActive=screen===item.id||(screen==="lesson"&&item.id==="dashboard");return(<div key={item.id} onClick={()=>setScreen(item.id)} style={{padding:"8px 11px",borderRadius:9,marginBottom:1,cursor:"pointer",display:"flex",alignItems:"center",gap:8,background:isActive?"rgba(79,142,247,0.12)":"transparent",border:`1px solid ${isActive?"rgba(79,142,247,0.25)":"transparent"}`,color:isActive?C.blue:C.textMuted,fontSize:12,fontWeight:isActive?600:400,transition:"all .15s",position:"relative"}}>{isActive&&<div style={{position:"absolute",left:-8,top:"50%",transform:"translateY(-50%)",width:3,height:14,borderRadius:9,background:C.blue,boxShadow:`0 0 7px ${C.blue}`}}/>}<span style={{fontSize:14}}>{item.icon}</span><span>{item.label}</span></div>);})}
          <div style={{fontSize:9,fontWeight:700,color:C.textDim,padding:"14px 11px 5px",textTransform:"uppercase",letterSpacing:"0.12em"}}>Modules</div>
          {MODULES.map(mod=>{const done=progress[mod.id]?.completed;const isAL=activeMod?.id===mod.id&&screen==="lesson";const prog=progress[mod.id];const pct=prog?.lessons?Math.round((prog.lessons/mod.lessons.length)*100):0;return(<div key={mod.id} onClick={()=>goModule(mod)} style={{padding:"6px 11px",borderRadius:7,marginBottom:1,cursor:"pointer",display:"flex",alignItems:"center",gap:7,background:isAL?"rgba(255,255,255,0.05)":"transparent",transition:"all .15s"}}><div style={{width:19,height:19,borderRadius:4,flexShrink:0,background:done?mod.color+"22":"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",border:done?`1px solid ${mod.color}44`:"1px solid rgba(255,255,255,0.06)"}}><SI name={mod.icon} size={10} color={done?mod.color:"rgba(255,255,255,0.45)"}/></div><div style={{flex:1,overflow:"hidden"}}><div style={{fontSize:10,fontWeight:isAL?600:400,color:isAL?C.text:C.textMuted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{mod.title}</div>{pct>0&&!done&&<div style={{height:2,background:"rgba(255,255,255,0.06)",borderRadius:2,marginTop:2,overflow:"hidden"}}><div style={{height:2,width:`${pct}%`,background:mod.color,borderRadius:2}}/></div>}</div>{done?<div style={{width:5,height:5,borderRadius:"50%",background:C.green,flexShrink:0}}/>:<div style={{fontSize:7,color:C.green,padding:"1px 4px",background:"rgba(52,211,153,0.1)",borderRadius:3,flexShrink:0,fontWeight:700}}>OPEN</div>}</div>);})}
        </div>
        <div style={{borderTop:`1px solid ${C.border}`}}>
          <div style={{padding:"9px 13px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:9,color:C.textMuted}}>XP Progress</span><span style={{fontSize:9,color:C.blue,fontWeight:600}}>{xp}/{TOTAL_XP}</span></div><div style={{height:3,background:"rgba(255,255,255,0.06)",borderRadius:9,overflow:"hidden"}}><div style={{height:3,width:`${Math.min(100,(xp/TOTAL_XP)*100)}%`,background:C.grad1,borderRadius:9,transition:"width .5s"}}/></div></div>
          <div onClick={()=>setScreen("profile")} style={{padding:"7px 13px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:9}}>
            <div style={{width:28,height:28,borderRadius:7,flexShrink:0,background:C.grad1,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:SORA,fontSize:12,fontWeight:800,color:"#fff"}}>{user?.name?.[0]?.toUpperCase()}</div>
            <div style={{flex:1,overflow:"hidden"}}><div style={{fontSize:11,fontWeight:600,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name}</div><div style={{fontSize:9,color:C.textMuted}}>Business Profile</div></div>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2"><polyline points="9,18 15,12 9,6"/></svg>
          </div>
        </div>
      </div>
      {/* MAIN */}
      <div style={{flex:1,marginLeft:215,overflowY:"auto",minHeight:"100vh"}}>
        <div style={{padding:"26px 28px",maxWidth:1060,margin:"0 auto"}}>
          {screen==="dashboard" && <Dashboard user={user} progress={progress} xp={xp} onModule={goModule} onNav={id=>setScreen(id)}/>}
          {screen==="media"     && <MediaLibrary/>}
          {screen==="kit"       && <EntrepreneurKit/>}
          {screen==="prompts"   && <PromptStudio/>}
          {screen==="journal"   && <Journal/>}
          {screen==="calc"      && <Calculator/>}
          {screen==="reports"   && <ReportGenerator/>}
          {screen==="profile"   && <BusinessProfile user={user} progress={progress} xp={xp}/>}
          {screen==="tools"     && <ToolsDir/>}
          {screen==="lesson"    && activeMod && <LessonViewer module={activeMod} lessonIdx={lessonIdx} onBack={()=>setScreen("dashboard")} onNext={goNext} onPrev={goPrev}/>}
        </div>
      </div>
    </div>
  );
}
